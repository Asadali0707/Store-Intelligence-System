version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: si_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    container_name: si_pipeline
    environment:
      - REDIS_URL=redis://redis:6379
      - VIDEO_SOURCE=${VIDEO_SOURCE:-/data/sample.mp4}
      - CAMERA_ID=CAM_01
      - STORE_ID=ST1008
      - FPS_SAMPLE=5
      - YOLO_CONF=0.45
      - REENTRY_COOLDOWN_SEC=300
    volumes:
      - ${VIDEO_DIR:-./data}:/data:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: si_api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - DB_PATH=/db/store_intelligence.db
      - STORE_ID=ST1008
      - CACHE_TTL=30
    volumes:
      - db_data:/db
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  dashboard:
    image: nginx:alpine
    container_name: si_dashboard
    ports:
      - "3000:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis_data:
  db_data:
